version: '3.8'

services:
  # MySQL 数据库服务
  # 用途：替代默认的 H2 内存数据库，提供真正的持久化存储。
  # 启动：在 docker/ 目录下运行 docker compose up -d
  # 停止：docker compose down
  mysql:
    image: mysql:8.0
    container_name: batchlab-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: batchlab_db
      MYSQL_USER: batch_user
      MYSQL_PASSWORD: batch_pass
    volumes:
      - mysql-data:/var/lib/mysql
      # 自动执行建表 SQL (Docker MySQL 会自动执行 /docker-entrypoint-initdb.d/ 下的 .sql 文件)
      - ../src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

volumes:
  mysql-data:
